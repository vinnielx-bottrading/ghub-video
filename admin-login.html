<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Admin - GHUB X</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">

  <style>
    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 0%, #191e2c 0%, var(--bg-cosmos) 60%);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .login-brand .icon {
      width: 38px; height: 38px;
      background: var(--accent-gradient);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .login-brand .icon i { color: #fff; font-size: 1rem; }
    .login-brand span {
      font-size: 1.3rem; font-weight: 800; color: var(--text-primary);
    }
    .login-brand span b {
      background: linear-gradient(135deg, #fff 40%, #94a3b8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-title { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); text-align: center; margin-bottom: 4px; }
    .login-subtitle { font-size: 0.85rem; color: var(--text-tertiary); text-align: center; margin-bottom: 24px; }
    .login-field { margin-bottom: 16px; }
    .login-field label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
    .login-field input {
      width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-glass); background: var(--bg-pill);
      color: var(--text-primary); font-size: 0.92rem; font-family: inherit;
    }
    .login-field input:focus { outline: none; border-color: var(--accent-primary); }
    .login-error {
      display: none;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5; font-size: 0.82rem; padding: 10px 12px; border-radius: var(--radius-sm);
      margin-bottom: 16px;
    }
    .login-submit {
      width: 100%; padding: 13px; border: none; border-radius: var(--radius-pill);
      background: var(--accent-gradient); color: #fff; font-weight: 700; font-size: 0.92rem;
      cursor: pointer; box-shadow: 0 4px 16px var(--accent-glow);
      font-family: inherit;
    }
    .login-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-back { display: block; text-align: center; margin-top: 18px; font-size: 0.82rem; color: var(--text-tertiary); text-decoration: none; }
    .login-back:hover { color: var(--text-secondary); }
  </style>
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand">
      <div class="icon"><i class="fa-solid fa-clapperboard"></i></div>
      <span>GHUB <b>X</b></span>
    </div>
    <div class="login-title">Đăng nhập Studio Manager</div>
    <div class="login-subtitle">Chỉ dành cho quản trị viên GHUB X</div>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="login-field">
        <label for="usernameInput">Tên đăng nhập</label>
        <input type="text" id="usernameInput" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="passwordInput">Mật khẩu</label>
        <input type="password" id="passwordInput" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-submit" id="loginSubmitBtn">Đăng nhập</button>
    </form>

    <a href="index.html" class="login-back">← Quay lại trang xem video</a>
  </div>

  <script src="js/admin-login.js"></script>
</body>
</html>
