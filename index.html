<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GHUB X - Nền tảng chia sẻ và phát trực tuyến video chuẩn 4K HDR với trải nghiệm điện ảnh đỉnh cao.">
  <title>GHUB X - Trải Nghiệm Video Điện Ảnh 4K</title>
  
  <!-- Premium Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Pro Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Frosted Glass Navbar -->
  <header class="header">
    <div class="header-left">
      <button class="menu-toggle-btn" id="menuToggleBtn" title="Thu gọn / Mở rộng menu">
        <i class="fa-solid fa-bars-staggered"></i>
      </button>
      <a href="#" class="brand-logo">
        <div class="brand-icon">
          <i class="fa-solid fa-play"></i>
        </div>
        <span>GHUB <span class="brand-text-pro">X</span></span>
      </a>
    </div>

    <div class="header-center">
      <div class="search-box-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Khám phá video 4K, công nghệ, âm nhạc, khoa học...">
        <button id="searchBtn" class="search-btn" title="Tìm kiếm">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <div class="header-right">
      <!-- Đã bỏ nút chuông thông báo — không gắn chức năng gì (không có hệ
           thống thông báo thật phía sau), giữ lại sẽ gây hiểu lầm là có tính
           năng thông báo trong khi bấm vào không có phản ứng gì. -->
      <div id="headerAuthSlot" class="header-auth-slot">
        <!-- Injected via js/auth.js: nút "Đăng nhập" hoặc phiên người dùng hiện tại -->
      </div>
    </div>
  </header>

  <!-- App Structure -->
  <div class="app-container">
    
    <!-- Minimalist Sidebar — chỉ còn Trang chủ + Thể loại theo yêu cầu, bỏ
         hết các mục trang trí không hoạt động (Thịnh hành, Kênh theo dõi,
         Thư viện, Kênh đề xuất) để menu gọn và không gây hiểu nhầm. -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-group">
        <div class="sidebar-header-label">Khám phá</div>
        <a href="#" class="nav-item active" id="navHomeBtn">
          <i class="fa-solid fa-compass"></i>
          <span class="nav-text">Trang chủ</span>
        </a>
        <a href="gallery.html" class="nav-item" id="navGalleryBtn">
          <i class="fa-solid fa-images"></i>
          <span class="nav-text">Bộ sưu tập ảnh</span>
        </a>
      </div>

      <!-- Thể loại: tự động lấy theo danh mục video hiện có trong MongoDB —
           admin gõ thêm thể loại mới khi Thêm Video sẽ tự xuất hiện ở đây. -->
      <div class="sidebar-group">
        <div class="sidebar-header-label">Thể loại</div>
        <div id="sidebarCategoryList">
          <!-- Injected via js/app.js -->
        </div>
      </div>
    </aside>

    <!-- Main Content Flow -->
    <main class="main-content">
      
      <!-- Hero Banner — dạng slideshow ảnh thuần túy, không chữ, không nút.
           Nội dung (ảnh + video liên kết nếu có) hoàn toàn do Admin quản lý
           trong trang quản trị (mục "Hero Banner" riêng biệt), lấy dữ liệu
           từ GET /api/hero-banners. Bấm vào slide sẽ mở video liên kết (nếu
           có); slide chỉ có ảnh tĩnh thì không có hành động khi bấm. -->
      <section class="hero-spotlight" id="heroSpotlight" style="display:none;">
        <div class="hero-backdrop" id="heroBackdrop"></div>
        <div class="hero-slide-nav" id="heroSlideNav" style="display:none;">
          <button class="hero-nav-arrow hero-nav-prev" id="heroPrevBtn" title="Slide trước"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="hero-nav-arrow hero-nav-next" id="heroNextBtn" title="Slide tiếp theo"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="hero-dots" id="heroDots"></div>
      </section>

      <!-- Category Filter Pills -->
      <div class="category-bar-wrapper" id="categoryBar">
        <!-- Injected via JavaScript -->
      </div>

      <!-- Section Title -->
      <div class="section-header-row">
        <h2 class="section-title">
          <i class="fa-solid fa-sparkles" style="color: var(--accent-primary);"></i>
          <span>Tuyển tập được đề xuất cho bạn</span>
        </h2>
      </div>

      <!-- Video Grid -->
      <section class="video-grid" id="videoGrid">
        <!-- Injected via JavaScript -->
      </section>

      <!-- Phân trang truyền thống (1 2 3 ... trang cuối) — thay cho cuộn vô
           hạn, dữ liệu từng trang lấy trực tiếp từ GET /api/videos?page=&limit= -->
      <nav class="pagination-bar" id="paginationBar" aria-label="Điều hướng trang video">
        <!-- Injected via JavaScript -->
      </nav>

    </main>
  </div>

  <!-- Watch Modal: Cinema Ambient Lighting Player -->
  <div class="watch-overlay" id="watchOverlay">
    <!-- Logo GHUB X trên trang Player — bấm vào sẽ đóng player và quay về
         trang chủ (cùng cơ chế với nút đóng, chỉ khác vị trí/hình thức). -->
    <a href="#" class="watch-brand-logo" id="watchBrandLogo" title="Về trang chủ GHUB X">
      <div class="brand-icon">
        <i class="fa-solid fa-play"></i>
      </div>
      <span>GHUB <span class="brand-text-pro">X</span></span>
    </a>
    <button class="close-watch-btn" id="closeWatchBtn" title="Thoát chế độ rạp phim">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <div class="watch-container">
      <!-- Main Video Column -->
      <div class="watch-main-column">
        <!-- Ambient Glowing Player Box -->
        <div class="player-ambient-wrapper">
          <div class="player-container" id="playerContainer">
            <video class="player-video" id="mainVideoPlayer" playsinline></video>

            <!-- Dùng cho video nhúng từ YouTube/Vimeo/embed khác — không điều khiển
                 được bằng thanh công cụ tùy chỉnh nên player-controls sẽ bị ẩn. -->
            <!-- ĐÃ BỎ HẲN thuộc tính sandbox theo yêu cầu, sau khi đã thử 2 mức
                 hạn chế (chặn hết popup/redirect, rồi nới thêm allow-forms +
                 allow-popups) mà nhiều nguồn nhúng miễn phí (mixdrop/streamtape/
                 doodstream...) vẫn tự crash/đen màn hình (lỗi JS phía họ, vd
                 "__i18n is not defined", do 1 script phụ trợ của họ vẫn bị chặn
                 bởi sandbox dù đã nới). Không còn sandbox nghĩa là:
                   - Video từ các nguồn này sẽ phát được (không còn bị host tự
                     chặn khi phát hiện bị nhúng hạn chế).
                   - ĐÁNH ĐỔI: người xem bấm vào video có thể bị mở tab mới HOẶC
                     bị chuyển hẳn sang trang nguồn (kiểu quảng cáo "popunder"/
                     redirect) — đây là rủi ro đã được xác nhận chấp nhận.
                 Muốn tránh hẳn rủi ro này cho 1 video cụ thể: đổi nguồn video đó
                 sang host đáng tin cậy hơn (YouTube/Vimeo/Dailymotion/Streamable/
                 Bunny Stream) thay vì các nguồn nhúng miễn phí kể trên.
                 referrerpolicy: giữ "strict-origin-when-cross-origin" — nhiều
                 nguồn nhúng miễn phí (mixdrop/streamtape/byse...) chặn hotlink
                 bằng cách kiểm tra header Referer; nếu không gửi gì (no-referrer)
                 họ có thể trả về trang lỗi/404 hoặc chặn hẳn nội dung thay vì
                 phát video. Mức "strict-origin-when-cross-origin" chỉ gửi tên
                 miền gốc (vd https://ghub-video.onrender.com), KHÔNG gửi đường
                 dẫn trang/video cụ thể đang xem, vẫn giữ được phần lớn quyền
                 riêng tư trong khi đáp ứng được kiểm tra referer của các nguồn
                 nhúng này. -->
            <iframe class="player-iframe" id="embedVideoPlayer" style="display:none;" src="" title="Video nhúng" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen frameborder="0" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <!-- Frosted Floating Controls -->
            <div class="player-controls" id="playerControls">
              <!-- Custom Scrubber Track -->
              <div class="progress-track" id="progressContainer">
                <div class="progress-fill" id="progressBar"></div>
              </div>

              <!-- Controls Row -->
              <div class="controls-row">
                <div class="controls-left">
                  <button class="ctrl-btn" id="playPauseBtn" title="Phát/Tạm dừng">
                    <i class="fa-solid fa-play"></i>
                  </button>
                  <div class="volume-wrapper">
                    <button class="ctrl-btn" id="muteBtn" title="Âm thanh">
                      <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                  </div>
                  <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                </div>

                <div class="controls-right">
                  <select class="speed-select" id="speedSelect" title="Tốc độ xem">
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1.0x Chuẩn</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2.0x</option>
                  </select>
                  <button class="ctrl-btn" id="fullscreenBtn" title="Xem toàn màn hình">
                    <i class="fa-solid fa-expand"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Video Metadata & Creator Bar -->
        <div class="watch-info-area">
          <h1 class="watch-title" id="watchTitle">Tiêu đề Video</h1>
          
          <div class="watch-creator-bar">
            <div class="watch-actions-pills">
              <button class="action-pill-glass" id="likeBtn">
                <i class="fa-regular fa-thumbs-up"></i>
                <span id="likeCountSpan">0</span>
              </button>
              <button class="action-pill-glass" id="dislikeBtn" title="Không thích">
                <i class="fa-regular fa-thumbs-down"></i>
              </button>
              <button class="action-pill-glass" id="shareBtn">
                <i class="fa-solid fa-share-nodes"></i>
                <span>Chia sẻ</span>
              </button>
              <button class="action-pill-glass" id="bookmarkBtn">
                <i class="fa-regular fa-bookmark"></i>
                <span>Lưu lại</span>
              </button>
            </div>
          </div>

          <!-- Description Box -->
          <div class="description-card">
            <div class="desc-stats-highlight" id="watchViewsDate">0 lượt xem • Đăng ngày...</div>
            <div id="watchDesc">Nội dung tóm tắt của video...</div>
          </div>
        </div>

        <!-- Comments Container -->
        <div class="comments-container">
          <h3 class="comments-header" id="commentsCountTitle">Bình luận</h3>

          <div class="comment-input-row">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="channel-avatar-img">
            <div class="comment-textarea-wrap">
              <input type="text" class="comment-input-field" id="commentInput" placeholder="Để lại cảm nghĩ của bạn về video...">
              <button class="btn-post-comment" id="submitCommentBtn">Gửi bình luận</button>
            </div>
          </div>

          <div class="comment-list" id="commentsList">
            <!-- Dynamic comments injected -->
          </div>
        </div>
      </div>

      <!-- Related Videos Column -->
      <div class="related-column">
        <h3 class="related-header">Video liên quan</h3>
        <div id="relatedVideosList">
          <!-- Dynamic related videos injected -->
        </div>
      </div>
    </div>
  </div>

  <!-- Auth Modal: Đăng nhập / Đăng ký người xem -->
  <div class="auth-modal-overlay" id="authModal">
    <div class="auth-modal-card">
      <button class="auth-modal-close" id="authModalClose" title="Đóng">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="auth-modal-brand">
        <div class="icon"><i class="fa-solid fa-clapperboard"></i></div>
        <span>GHUB <b>X</b></span>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="authTabLogin">Đăng nhập</button>
        <button type="button" class="auth-tab-btn" id="authTabRegister">Đăng ký</button>
      </div>

      <!-- Đăng nhập -->
      <form class="auth-form" id="loginFormViewer" style="display:flex;">
        <div class="auth-error" id="loginErrorViewer"></div>
        <div class="auth-field">
          <label for="loginUsernameViewer">Tên đăng nhập hoặc email</label>
          <input type="text" id="loginUsernameViewer" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="loginPasswordViewer">Mật khẩu</label>
          <input type="password" id="loginPasswordViewer" autocomplete="current-password" required>
        </div>
        <button type="submit" class="auth-submit-btn" id="loginSubmitBtnViewer">Đăng nhập</button>
      </form>

      <!-- Đăng ký -->
      <form class="auth-form" id="registerFormViewer" style="display:none;">
        <div class="auth-error" id="registerErrorViewer"></div>
        <div class="auth-field">
          <label for="regUsername">Tên đăng nhập</label>
          <input type="text" id="regUsername" autocomplete="username" minlength="3" maxlength="30" required>
        </div>
        <div class="auth-field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="regPassword">Mật khẩu</label>
          <input type="password" id="regPassword" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="auth-field">
          <label for="regPasswordConfirm">Nhập lại mật khẩu</label>
          <input type="password" id="regPasswordConfirm" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="auth-field">
          <label>Mã xác nhận (CAPTCHA)</label>
          <div class="captcha-row">
            <img id="captchaImg" class="captcha-img" alt="Mã CAPTCHA" src="">
            <button type="button" class="captcha-refresh-btn" id="captchaRefreshBtn" title="Tải mã khác">
              <i class="fa-solid fa-rotate"></i>
            </button>
          </div>
          <input type="text" id="regCaptchaInput" class="captcha-input" placeholder="Nhập mã trong ảnh" autocomplete="off" required>
        </div>
        <button type="submit" class="auth-submit-btn" id="registerSubmitBtnViewer">Đăng ký</button>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
